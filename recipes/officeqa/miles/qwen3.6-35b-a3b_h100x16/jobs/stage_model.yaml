# OfficeQA on upstream miles, Qwen3.6-35B-A3B: stage the model and convert it to Megatron torch_dist (8 H100s).
# Submit with the run id, volume root and image filled in: see README.md, "Running a recipe".
experiment_name: rft-officeqa-miles-q36-stage_model
compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100
environment:
  docker_image:
    url: <miles-image>
code_source:
  type: snapshot
  snapshot:
    root_path: ../../../../..
    include_paths: [pyproject.toml, README.md, src, frameworks, recipes]
env_variables:
  RFT_RECIPE: officeqa/miles/qwen3.6-35b-a3b_h100x16
  RFT_RUN_ID: <run-id>
  RFT_VOLUME_ROOT: <volume-root>
  RFT_SET: ""                 # recipe overrides, e.g. "eval.baseline_run=<verl run id>"
  TOKENIZERS_PARALLELISM: "false"
  HF_HOME: /tmp/hf
  HF_HUB_DISABLE_XET: "1"
  RAY_TEMP_DIR: /tmp/ray
secrets:
  HF_TOKEN: secret_scope/hf_token   # fill in: <scope>/<key> of a Databricks secret
max_retries: 0
timeout_minutes: 240
command: bash ${CODE_SOURCE_PATH}/frameworks/miles/launch/node.sh stage_model
