# Math quickstart on verl, Qwen3.5-2B: train (8 H100s).
# Submit with the run id, volume root and image filled in: see README.md, "Running a recipe".
experiment_name: rft-math-verl-2b-train
compute:
  num_accelerators: 8
  accelerator_type: GPU_8xH100
environment:
  docker_image:
    url: <verl-image>
code_source:
  type: snapshot
  snapshot:
    root_path: ../../../../..
    include_paths: [pyproject.toml, README.md, src, frameworks, recipes]
env_variables:
  RFT_RECIPE: math/verl/qwen3.5-2b_h100x8
  RFT_RUN_ID: <run-id>
  RFT_VOLUME_ROOT: <volume-root>
  RFT_SET: ""                 # recipe overrides, e.g. "train.seed=7 eval.seed=42"
  TOKENIZERS_PARALLELISM: "false"
  HF_HOME: /tmp/hf
  HF_HUB_DISABLE_XET: "1"
  RAY_TEMP_DIR: /tmp/ray
  CUDA_DEVICE_MAX_CONNECTIONS: "1"
  VLLM_ALLREDUCE_USE_SYMM_MEM: "0"
max_retries: 0
timeout_minutes: 60
command: bash ${CODE_SOURCE_PATH}/frameworks/verl/launch/node.sh train
