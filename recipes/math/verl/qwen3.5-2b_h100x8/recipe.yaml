# Math quickstart: Qwen3.5-2B solves MATH problems (levels 1-3) with a calculator, on one node of 8
# H100s (4 train, 4 serve), and is evaluated on MATH-500 before and after training.
# The recipe checks the plumbing, not learning: two updates with a checkpoint each, export, and an
# evaluation of the export. A run takes about 50 minutes.
#
# Status: measured (run math-2b-02, docs/records/math-2b-02): MATH-500 61.8% -> 62.0% (+0.2 points,
# 95% CI -2.8 to +3.2), as expected after two updates.
extends: agentic/verl
description: Math quickstart on verl, Qwen3.5-2B, 1 node.
task: math

model:
  id: Qwen/Qwen3.5-2B
  revision: 15852e8c16360a2fea060d615a32b45270f8a8fc
  tool_parser: qwen3_coder          # verl's parser and vLLM's --tool-call-parser
  # No server-side reasoning parser: the harness splits on </think> exactly as the training loop
  # does. vLLM's qwen3 parser reads a reply without </think> (Qwen3.5's default, non-thinking
  # template) as all reasoning, which empties the answer.
  reasoning_parser: null
  serve_args: [--language-model-only]   # text-only episodes: vLLM skips the vision tower
  chat_template_kwargs: {}

data:
  levels: [1, 2, 3]
  train_limit: 0
  eval_limit: 0

agent:
  max_turns: 4
  max_response_tokens: 4096
  max_turn_tokens: 2048

train:
  rollout_n: 4
  ppo_mini_batch_size: 8
  total_training_steps: 2
  save_freq: 1

compute:
  nodes: 1
  accelerator: GPU_8xH100
  trainer_gpus: 4
  rollout_gpus: 4
  timeout_minutes: 60
