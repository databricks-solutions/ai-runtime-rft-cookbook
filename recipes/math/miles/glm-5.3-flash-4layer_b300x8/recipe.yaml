# Technical smoke on upstream miles: GLM-5.3-Flash's 4-layer slice with a calculator on one 8xB300
# node, colocated in upstream's slice layout (TP2/PP2/EP2 training, two SGLang engines of 4 GPUs).
# The slice keeps 4 of the model's 45 layers, so its answers carry no learning signal: this recipe
# qualifies plumbing (episodes through the session server, cookbook scoring, two updates with
# weight sync, published checkpoints), not a result.
# Status: untested (no qualification record yet). GPU smoke 2026-10-23 on miles v0.1.3 and its image
# (frameworks/miles/image): 2 rollouts of 16 episodes through the session server, both updates, weight
# sync, iter_0000001 published (336.6 GB).
extends: agentic/miles
description: Math on upstream miles, GLM-5.3-Flash 4-layer slice, 1 node (technical smoke).
task: math

model:
  id: CharyZeng/GLM-5.3-Flash-4layer
  revision: 7fb7883207fe73ea04430ac392f6ffe2b9f936c4
  launcher: scripts/run_glm5_3_flash.py
  model_name: GLM-5.3-Flash-4layer
  megatron_type: glm5.3-flash-4layer
  convert_args: "--tensor-model-parallel-size 2 --pipeline-model-parallel-size 1"   # as upstream's CI converts the slice
  tool_parser: glm47
  reasoning_parser: glm45
  # The slice has no processor_config.json, and SGLang loads the image processor of this
  # vision-language architecture even for text. The slice's vision configuration and tokenizer are the
  # full model's, so its processor configuration applies.
  processor_from:
    id: zai-org/GLM-5.3-Flash
    revision: eb9eb208eb0d988989d07a6a12d0fdeb5f52574a
    files: [processor_config.json]

data:                          # the math quickstart's data: one prepared copy serves every framework
  levels: [1, 2, 3]
  train_limit: 0
  eval_limit: 0

agent:
  max_turns: 2
  max_response_tokens: 1024
  max_turn_tokens: 512

train:
  num_rollout: 2
  rollout_batch_size: 4
  n_samples_per_prompt: 4
  save_interval: 2

compute:
  nodes: 1
  accelerator: GPU_8xB300
  timeout_minutes: 120
