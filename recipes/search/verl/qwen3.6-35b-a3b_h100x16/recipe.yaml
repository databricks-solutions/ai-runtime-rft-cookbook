# Agentic search on verl: Qwen3.6-35B-A3B answers MuSiQue multi-hop questions by searching a
# Databricks Vector Search index of encyclopedia passages. Exact-match reward, no judge. Two nodes of
# 8 H100s: one trains, one serves.
# Held out: 500 MuSiQue validation questions, stratified by hop count. The index is your workspace's
# (RFT_VS_INDEX in site.env); rft_cookbook.tasks.search describes what it must contain.
#
# Status: measured (run search-q36-01, docs/records/search-q36-01): 50 updates in about 2.5 hours;
# held-out exact match 28.2% -> 37.4% (+9.2 points, 95% CI +5.2 to +13.4).
# Most of the gain comes from answering more often. The trained model answers 87% of the held-out
# questions (the base model 48%: 223 of its 500 episodes reach the turn limit), after fewer searches
# (5.7 tool calls against 10.0). Its answers are less precise: 43% are right, against 58.5%.
#
# Why 16 turns: with 12, the base model reached the limit in half its episodes, most of them still
# searching. The longest of those used about 25,600 of the 43,008-token context, about 1,000 tokens a
# turn, so 16 turns fit.
# The reward and batch come from an earlier prototype on Qwen3.5-35B-A3B, with the same held-out
# questions and index: a pure exact-match reward (a bonus for retrieving the answer diluted it), 32
# trajectories an update in groups of 16, and learning rate 2e-6.
extends: agentic/verl
description: Agentic search (MuSiQue) on verl, Qwen3.6-35B-A3B, Databricks Vector Search.
task: search
stages: [prep, stage_model, baseline_eval, train, export, eval, compare]

model:
  id: Qwen/Qwen3.6-35B-A3B
  revision: 995ad96eacd98c81ed38be0c5b274b04031597b0
  tool_parser: qwen3_coder
  reasoning_parser: null              # the harness splits </think> itself, as training does
  serve_args: [--language-model-only]
  chat_template_kwargs: {}

data:
  max_prompt_tokens: 2048             # with the task's 40,960-token response budget: a 43,008 context

agent:                                # the task's budgets (4,096 tokens per turn), with 16 turns, not 12
  max_turns: 16

eval:
  samples: 1                          # 532 episodes: one per question, paired by question (McNemar)
  temperature: 1.0
  top_p: 1.0
  top_k: -1
  concurrency: 32
  gpu_memory_utilization: 0.8
  tensor_parallel: 8
  request_timeout_s: 600
  probe_splits: [probe]               # training questions evaluated on purpose, reported apart

train:
  rollout_n: 16
  ppo_mini_batch_size: 2              # 32 trajectories an update
  parameter_sync_step: 1
  total_training_steps: 50            # the prototype's held-out gains came by its 20th update
  lr: 2.0e-6
  kl_loss_coef: 0.01                  # low-variance KL to the base model, as in the OfficeQA recipes
  save_freq: 25
  seed: 42

strategy:
  tp: 2
  cp: 4
  ep: 8
  remove_padding: true
  fused_kernels: true

checkpoint:
  location: volume                    # ~490 GB a save, saved where it is published
  hash_files: false
  keep: 2

rollout:
  tensor_parallel: 8

compute:
  nodes: 2
  accelerator: GPU_8xH100
  trainer_gpus: 8
  rollout_gpus: 8
  timeout_minutes: 240
  train_timeout_minutes: 720
