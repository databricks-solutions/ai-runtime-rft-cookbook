# CPU tiers of docs/architecture.md "Testing": unit, adapter contract, jobs and public safety.
# GPU tiers never run here; they are maintainer-triggered AI Runtime jobs.
name: ci
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pyyaml==6.0.3 regex sympy==1.14.0 pylatexenc==2.10 setuptools openai
      - run: pip install --no-deps --no-build-isolation -e .
      - run: pytest tests

  verl:
    # The adapter against the pinned verl on CPU: real ToolAgentLoop, real Qwen3.5 tokenizer,
    # Hydra composition of every resolved argument.
    runs-on: ubuntu-latest
    env:
      VERL_COMMIT: 8718ca30a3f002f93b7c4fd99b9b2506718681bc
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.13.*"
      - run: >
          pip install "transformers==5.12.1" "ray==2.*" hydra-core omegaconf "tensordict>=0.8.0,<=0.10.0,!=0.9.0"
          numpy pandas "pyarrow>=19" pydantic pillow codetiming dill datasets cachetools pytest pyyaml
          sympy pylatexenc jinja2 aiohttp fastapi uvicorn "TransferQueue==0.1.10" setuptools huggingface_hub
      - run: pip install --no-deps "verl @ git+https://github.com/verl-project/verl.git@${VERL_COMMIT}"
      - run: pip install --no-deps --no-build-isolation -e . -e frameworks/verl
      - name: Qwen3.5 tokenizer and chat template
        run: |
          python -c "from huggingface_hub import snapshot_download as d; print(d('Qwen/Qwen3.5-0.8B', allow_patterns=['*.json','*.txt','*.jinja'], local_dir='/tmp/qwen3.5-tokenizer'))"
          echo "RFT_TEST_TOKENIZER=/tmp/qwen3.5-tokenizer" >> "$GITHUB_ENV"
      - run: pytest frameworks/verl/tests

  miles:
    # The adapter on CPU without miles: resolved launcher arguments, the agent function against a
    # scripted endpoint, the reward and post-save hooks, the checked-in jobs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pyyaml==6.0.3 sympy==1.14.0 pylatexenc==2.10 setuptools transformers openai
      - run: pip install --no-deps --no-build-isolation -e . -e frameworks/miles
      - run: pytest frameworks/miles/tests

  miles-api:
    # The adapter against the pinned miles (tier 3): its hooks with miles' own loader and against the
    # calls miles makes, miles' session post-processing on its samples, every recipe flag against
    # miles' parser, and the drift logging (torch).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --index-url https://download.pytorch.org/whl/cpu "torch==2.13.*"
      - run: pip install pytest pyyaml==6.0.3 sympy==1.14.0 pylatexenc==2.10 setuptools transformers openai numpy aiohttp
      - run: pip install --no-deps --no-build-isolation -e . -e frameworks/miles
      - name: The pinned miles source, checked against its sha256
        run: |
          read -r url sha < <(python -c "import json; l = json.load(open('frameworks/miles/rft_miles/miles.lock.json')); print(l['tarball'], l['tarball_sha256'])")
          curl -sSL -o /tmp/miles.tar.gz "$url"
          echo "$sha  /tmp/miles.tar.gz" | sha256sum -c
          mkdir -p /tmp/miles && tar -xzf /tmp/miles.tar.gz -C /tmp/miles --strip-components=1
          echo "PYTHONPATH=/tmp/miles" >> "$GITHUB_ENV"
      - run: pytest frameworks/miles/tests
